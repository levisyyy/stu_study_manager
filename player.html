<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>播放</title>
  <link rel="stylesheet" href="libs/xgplayer/index.min.css">
  <link rel="stylesheet" href="libs/tcplayer/tcplayer.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="player-page">
  <header class="topbar">
    <a class="back" href="index.html" aria-label="返回">&#8592;</a>
    <span class="title" id="course-title">视频播放</span>
  </header>

  <div class="player-wrap">
    <!-- xgplayer 容器（普通直链课节） -->
    <div id="xg-player"></div>
    <!-- TCPlayer 容器（云点播加密课节，必须是 video 标签） -->
    <video id="tc-player" class="tc-player" hidden playsinline webkit-playsinline preload="auto"></video>
    <div id="player-error" class="player-error" hidden>
      <p id="player-error-text">视频加载失败</p>
      <a href="index.html">返回课节列表</a>
    </div>
  </div>

  <script src="courses.js"></script>
  <script src="libs/xgplayer/index.min.js"></script>
  <!-- TCPlayer 及其 HLS 依赖 -->
  <script src="libs/tcplayer/libs/hls.min.js"></script>
  <script src="libs/tcplayer/tcplayer.v5.3.4.min.js"></script>
  <script>
    (function () {
      // 登录校验：未登录跳转登录页（localStorage 永久保存）
      if (localStorage.getItem("video_login") !== "1") {
        location.replace("login.html");
        return;
      }

      var errorEl = document.getElementById("player-error");
      var errorText = document.getElementById("player-error-text");

      function showError(msg) {
        errorText.textContent = msg;
        errorEl.hidden = false;
      }

      var params = new URLSearchParams(location.search);
      var id = params.get("id");
      // 在所有课程的课节里按 id 查找
      var course = null;
      (window.COURSES || []).forEach(function (c) {
        (c.lessons || []).forEach(function (l) {
          if (l.id === id) { course = l; }
        });
      });

      if (!course) {
        showError("未找到该课节");
        return;
      }

      document.getElementById("course-title").textContent = course.title;
      document.title = course.title;

      if (course.type === "vod" || course.type === "tcplayer") {
        // ===== 腾讯云课节：TCPlayer（加密 fileID+psign / 不加密直链） =====
        if (course.type === "vod" && !course.psign) {
          showError("该课节尚未配置播放器签名 psign：请到云点播控制台 → 分发播放 → 播放器签名工具生成（加密类型选 SimpleAES，码流模板选 12），然后填入 courses.js 对应课节的 psign 字段");
          return;
        }
        var tcEl = document.getElementById("tc-player");
        tcEl.hidden = false;
        var cfg = window.VOD_CONFIG || {};
        if (course.type === "tcplayer") {
          // ===== 腾讯云不加密直链：TCPlayer URL 播放（License 必传） =====
          TCPlayer(tcEl, {
            sources: [{ src: course.url }],
            licenseUrl: course.licenseUrl || cfg.licenseUrl,
            domain: course.domain || cfg.domain
          });
        } else {
          // ===== SimpleAES 加密课节：TCPlayer + fileID + psign =====
          TCPlayer(tcEl, {
            appID: String(course.appID),
            fileID: String(course.fileID),
            psign: course.psign,
            licenseUrl: course.licenseUrl || cfg.licenseUrl,
            // 域名校验：License 绑定的是正式域名，本地 localhost 对不上会报 Error 52
            // 通过 domain 参数手动指定 License 已绑定的域名即可通过（5.2.0+ 支持）
            domain: course.domain || cfg.domain
          });
        }
      } else {
        // ===== 普通直链课节：xgplayer =====
        var player = new Player({
          id: "xg-player",
          url: course.url,
          width: "100%",
          height: "100%",
          autoplay: true,
          playsinline: true,
          videoInit: true,
          rotate: {
            fullscreen: true,
            innerRotate: true
          },
          fullscreen: {
            useCssFullscreen: true
          },
          download: false,
          playbackRate: [0.5, 1, 1.25, 1.5, 2]
        });

        // 移动端（微信/自动播放被拦截等）会偶发误报 error 事件，
        // 需先确认 video 元素真的出错才显示提示；播放成功则确保提示隐藏
        player.on("error", function () {
          setTimeout(function () {
            var v = player.video;
            if (v && v.error) {
              showError("视频加载失败，请检查网络后重试");
            } else {
              errorEl.hidden = true;
            }
          }, 600);
        });
        player.on("play", function () {
          errorEl.hidden = true;
        });
      }
    })();
  </script>
</body>
</html>
